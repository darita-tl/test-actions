name: On Push
on:
  push:
    branches:
      - main

jobs:
  validate_push:
    # if: github.actor != 'github-actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get Changelog changes
        run: |
          NEW_VERSION=0.12.0
          OLD_VERSION=0.11.0
          FILE=CHANGELOG.md
          echo "Getting changes from $OLD_VERSION to $NEW_VERSION"
          cat $FILE
          CHANGELOG=$(awk -v v="$NEW_VERSION" -v o="$OLD_VERSION" '
          function is_header() { return $0 ~ /^##+ \[/ }
          function has_ver(ver) { return index($0, "[" ver "]") > 0 }
          {
            if (is_header()) {
              if (!printing && has_ver(v)) { printing=1; next }
              if (printing) {
                if (o != "" && has_ver(o)) exit
                if (o == "" && !has_ver(v)) exit
                if (o != "" && !has_ver(v) && !has_ver(o)) exit
              }
            }
            if (printing) print
          }
          ' "$FILE")
          echo "generated CHANGELOG for $NEW_VERSION"
          echo $CHANGELOG
      - name: Simple Message
        # if: github.actor != 'github-actions'
        run: |
          ls
          echo "Something is happening on ${{github.ref_name}} by ${{github.actor}}"
